apiVersion: apps/v1
kind: Deployment
metadata:
  name: laravel-app
  labels:
    app: laravel-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: laravel-app 
  template:
    metadata:
      labels:
        app: laravel-app
    spec:
      containers:
      - name: laravel-app
        image: ghcr.io/johndivam/prj_k8s:latest
        imagePullPolicy: IfNotPresent
        envFrom:
            - configMapRef:
                name: laravel-config
            - secretRef:
                name: laravel-secret
      - name: nginx
        image: nginx:1.27-alpine
        ports:
        - containerPort: 80 
        volumeMounts:
        - name: nginx-conf
          mountPath: /etc/nginx/conf.d
      volumes:
      - name: nginx-conf
        configMap:
          name: nginx-conf