apiVersion: v1
kind: ConfigMap
metadata:
  name: laravel-config
data:
  APP_NAME: "Laravel"
  APP_ENV: "local"
  APP_DEBUG: "true"
  APP_URL: "http://localhost"
  LOG_CHANNEL: "stderr"
  LOG_LEVEL: "info"
  SESSION_DRIVER: "cookie"
  CACHE_STORE: "file"
  QUEUE_CONNECTION: "sync"
  DB_CONNECTION: "mysql"
  DB_HOST: "database"
  DB_PORT: "3306"
  DB_DATABASE: "laravel2"
