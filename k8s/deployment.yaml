apiVersion: apps/v1
kind: Deployment
metadata:
  name: laravel
  namespace: laravel-app
  labels:
    app: laravel
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: laravel
  template:
    metadata:
      labels:
        app: laravel
    spec:
      # Copy public/ (css, js, images) from the app image so nginx can serve static files
      initContainers:
        - name: copy-public
          image: mohamedzh/prj_k8s-img:v1.0
          command: ["sh", "-c", "cp -a /var/www/html/public/. /shared-public/"]
          volumeMounts:
            - name: public
              mountPath: /shared-public
      containers:
        - name: php
          image: mohamedzh/prj_k8s-img:v1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9000
              name: fpm
          envFrom:
            - configMapRef:
                name: laravel-config
            - secretRef:
                name: laravel-secret
          readinessProbe:
            tcpSocket:
              port: fpm
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: public
              mountPath: /var/www/html/public
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          readinessProbe:
            httpGet:
              path: /up
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /up
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
      volumes:
        - name: public
          emptyDir: {}
        - name: nginx-conf
          configMap:
            name: nginx-config